server {
    listen 80;
    server_name _;
    client_max_body_size 512m;
    client_body_timeout 30s;

    root /usr/share/nginx/html;
    index index.html;

    # 匿名认证接口不承载文件，独立限制请求体，避免全站512MB上传上限放大JSON解析/Redis键DoS。
    location ^~ /api/auth/ {
        client_max_body_size 16k;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 网关上限略高于业务1MB，令常规超限请求进入应用并形成API_CALL审计；
    # 更大的运输层拒绝及连接限流写入独立结构化安全日志。
    location ^~ /api/integrations/webhook/ {
        client_max_body_size 2m;
        access_log /var/log/nginx/integration-security.log integration_security;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_conn webhook_per_ip 8;
        limit_conn webhook_global 64;
        limit_conn_status 429;
        add_header X-Request-ID $request_id always;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 仅导出响应关闭代理缓冲并放宽读取时限；普通/匿名API仍使用短超时和请求缓冲，避免slow-body占用后端线程。
    location ~ ^/api/datasets/([0-9]+/(export|export-package)|export-download/) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        limit_conn export_per_ip 4;
        limit_conn export_global 32;
        limit_conn_status 429;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
        send_timeout 120s;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
