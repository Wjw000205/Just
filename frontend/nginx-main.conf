user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    # Transport-level webhook rejects happen before Spring can create an API_CALL
    # audit row. Keep a body/header-free structured record for gateway evidence.
    log_format integration_security escape=json
                    '{"time":"$time_iso8601","requestId":"$request_id",'
                    '"remoteAddr":"$remote_addr","method":"$request_method",'
                    '"uri":"$uri","status":$status,"requestBytes":$request_length,'
                    '"responseBytes":$body_bytes_sent,"duration":$request_time}';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    limit_conn_zone $binary_remote_addr zone=export_per_ip:10m;
    limit_conn_zone $server_name zone=export_global:1m;
    limit_conn_zone $binary_remote_addr zone=webhook_per_ip:10m;
    limit_conn_zone $server_name zone=webhook_global:1m;

    include /etc/nginx/conf.d/*.conf;
}
